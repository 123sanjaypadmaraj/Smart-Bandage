# Serves the built dashboard as a single-page app: unknown paths fall back
# to index.html so client-side routing (if any is added later) still works.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
