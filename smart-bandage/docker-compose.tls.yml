# Production TLS overlay -- adds real HTTPS on top of docker-compose.yml
# instead of replacing it. Not used by a plain `docker compose up`; combine
# the two files explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#
# Prerequisites (see README.md "Deploy behind TLS" for the full walkthrough):
#   1. Edit docker/nginx.tls.conf: replace `your-domain.example` with your
#      real domain (must match the cert's CN/SAN).
#   2. Put `fullchain.pem` + `privkey.pem` in ./certs/ (git-ignored) --
#      from certbot, another ACME client, or `openssl req` for local testing.
#   3. Rebuild the frontend with a build-time API URL that actually points
#      at your deployed backend, e.g.:
#        VITE_API_BASE_URL=https://api.your-domain.example
#        VITE_WS_BASE_URL=wss://api.your-domain.example
#      (docker-compose.yml's frontend.build.args is the place to change
#      that -- Vite bakes it into the JS bundle at build time)
#
# docker-compose.yml's `db` (Postgres) service is already part of the base
# file this overlays, so no extra profile flag is needed to get both.
services:
  frontend:
    volumes:
      - ./docker/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"

  backend:
    volumes:
      - ./certs:/etc/certs:ro
    ports:
      - "8443:8443"
    # Overrides (not appends to) the base command -- uvicorn's built-in TLS
    # support (--ssl-certfile/--ssl-keyfile) is enough here; no separate
    # reverse-proxy container needed for the API the way the dashboard needs
    # nginx for static-file serving.
    command: >
      sh -c "cd /app && uvicorn backend.app.main:app --host 0.0.0.0 --port 8443
      --ssl-certfile=/etc/certs/fullchain.pem --ssl-keyfile=/etc/certs/privkey.pem"
