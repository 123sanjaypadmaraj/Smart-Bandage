# CI-equivalent of scripts/run_checks.sh, run on every push/PR instead of by
# hand. Two independent jobs (backend pytest, frontend typecheck+build) so a
# frontend-only or backend-only PR gets a faster, more specific result
# instead of one slow job wedging pytest and npm together sequentially.
#
# See README.md "What's scaffolded but not yet real" -- this is the first
# item on that list to move to "done".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tsc -b && vite build
        run: npm run build

  mobile:
    name: mobile (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck
