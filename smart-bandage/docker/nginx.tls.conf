# TLS variant of nginx.conf -- opt-in via docker-compose.tls.yml, which
# mounts this over the plain-HTTP default.conf the Dockerfile bakes in.
# Not used by a plain `docker compose up`; see README.md "Deploy behind TLS".
#
# Expects a real cert/key pair mounted read-only at the paths below (see
# docker-compose.tls.yml's `certs` volume) -- get one with:
#
#   certbot certonly --standalone -d your-domain.example
#
# then point the volume at Let's Encrypt's output directory (or your CA's
# equivalent) and edit `server_name` below. Self-signed works for testing:
#
#   openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#     -keyout certs/privkey.pem -out certs/fullchain.pem \
#     -subj "/CN=localhost"

# Plain HTTP: only exists to redirect to HTTPS, plus the ACME HTTP-01
# challenge path certbot's `--webroot` renewal method needs to hit without
# a redirect getting in the way.
server {
    listen 80;
    server_name your-domain.example;  # <-- edit this

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;  # <-- edit this (must match the cert)

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Forward-secret AEAD suites only -- narrower than the old
    # HIGH:!aNULL:!MD5 (OpenSSL's "HIGH" still admits non-forward-secret
    # RSA-kx and non-AEAD CBC suites). TLSv1.3's own suites aren't listed
    # here; OpenSSL negotiates those from a separate, always-modern list
    # this directive doesn't control.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers to only ever use HTTPS for this host from here on --
    # safe to add once the cert above is real and auto-renewing; drop this
    # header while still testing with a self-signed cert.
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
